<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>樂齡復健 - 首頁</title>
<style>
  :root {
    --bg: #faeaff;
    --panel: #f3f3f3;
    --line: #777;
    --ink: #111;
    --muted: #999;
    --blue: #6f82c8;
    --pink: #f8939f;
    --done: #7a6cc0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px;
  }
  .frame {
    max-width: 1200px;
    margin: 0 auto;
    padding: 4px;
    background: linear-gradient(90deg, var(--blue), var(--pink));
    border: 2px solid var(--ink);
  }
  .page {
    background: var(--bg);
    border: 2px solid var(--ink);
    min-height: 640px;
    padding: 16px 20px 32px;
  }

  /* 導覽列 */
  nav {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .avatar svg { width: 36px; height: 36px; }
  .menu {
    display: flex;
    flex: 1;
    justify-content: center;
    gap: clamp(20px, 5vw, 70px);
    list-style: none;
  }
  .menu a {
    color: var(--ink);
    text-decoration: none;
    font-size: 1.25rem;
    padding: 6px 4px;
    border-bottom: 3px solid transparent;
  }
  .menu a:hover, .menu a.active { border-bottom-color: var(--done); }
  .logout { color: var(--muted); font-size: 1.1rem; }

  /* 版面 */
  .layout {
    display: grid;
    grid-template-columns: 1fr 2.1fr;
    grid-template-rows: auto 1fr;
    gap: 24px;
  }
  .box {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
  }
  .box {
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .box:hover,
  .box:active,
  .box:focus-within {
    box-shadow: 0 10px 24px rgba(111, 90, 170, .35);
    transform: translateY(-3px);
  }
  @media (prefers-reduced-motion: reduce) {
    .box { transition: none; }
    .box:hover, .box:active, .box:focus-within { transform: none; }
  }
  .box h2 {
    font-size: 1.9rem;
    font-weight: 400;
    text-align: center;
    padding: 10px 16px 6px;
  }

  /* 今日任務 */
  .tasks {
    grid-row: 1 / 3;
    border-radius: 36px;
    padding: 8px 24px 24px;
  }
  .tasks h2 { border-bottom: 3px solid var(--ink); padding-bottom: 12px; margin-bottom: 4px; }
  .task {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 2px solid var(--line);
    font-size: 1.15rem;
  }
  .task button {
    width: 56px; height: 56px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 3px solid var(--line);
    background: transparent;
    cursor: pointer;
    font-size: 1.5rem;
    color: #fff;
  }
  .task button:focus-visible { outline: 3px solid var(--done); outline-offset: 2px; }
  .task.done span { text-decoration: line-through; color: var(--muted); }
  .task.done button { background: var(--done); border-color: var(--done); }

  /* 推薦 / 廣告 */
  .banner {
    position: relative;
    height: 280px;
    overflow: hidden;
    padding: 0;
  }
  .slide {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #fff;
    opacity: 0;
    transition: opacity .5s ease;
  }
  .slide.cover { object-fit: cover; }
  .slide.show { opacity: 1; }
  .banner .arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(255,255,255,.8); color: #555;
    font-size: 1.8rem; line-height: 1;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .banner .arrow:hover { background: #fff; color: var(--done); }
  .banner #prev { left: 12px; }
  .banner #next { right: 12px; }
  .dots {
    position: absolute; bottom: 10px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 10px;
  }
  .dots button {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1px solid #555; background: rgba(255,255,255,.8); cursor: pointer;
  }
  .dots button.on { background: var(--done); border-color: var(--done); }

  /* 下方兩格 */
  .bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .bottom .box { min-height: 250px; padding-bottom: 20px; }

  .ring {
    --pct: 0;
    width: 150px; height: 150px;
    margin: 16px auto 0;
    border-radius: 50%;
    background: conic-gradient(var(--done) calc(var(--pct) * 1%), #ddd 0);
    display: grid; place-items: center;
  }
  .ring b {
    width: 108px; height: 108px;
    border-radius: 50%;
    background: var(--panel);
    display: grid; place-items: center;
    font-size: 1.8rem; font-weight: 500;
  }
  .today-list { list-style: none; padding: 8px 24px; font-size: 1.15rem; }
  .today-list li { padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .today-list li:last-child { border-bottom: none; }


  html { scroll-behavior: smooth; }
  [id] { scroll-margin-top: 16px; }
  .quiz { margin-top: 24px; padding-bottom: 24px; }
  .quiz-body { padding: 8px 28px 0; }
  .q-meta { display: flex; justify-content: space-between; color: #555; font-size: 1.05rem; margin-bottom: 10px; }
  .q-text { font-size: 1.4rem; margin-bottom: 16px; }
  .q-options { display: grid; gap: 12px; }
  .q-options button {
    text-align: left; font: inherit; font-size: 1.15rem;
    padding: 14px 18px; border-radius: 12px;
    border: 2px solid var(--line); background: #fff; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .q-options button:hover:not(:disabled) { background: #efe9fb; border-color: var(--done); }
  .q-options button:disabled { cursor: default; }
  .q-options button.correct { background: #dff5e3; border-color: #3a9b57; }
  .q-options button.wrong { background: #fde2e2; border-color: #d64545; }
  .q-feedback { min-height: 1.6em; margin: 14px 0 6px; font-size: 1.1rem; }
  .q-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .btn {
    font: inherit; font-size: 1.1rem; padding: 12px 24px; border-radius: 999px;
    border: none; cursor: pointer; color: #fff; background: var(--done);
  }
  .btn:disabled { background: #bbb; cursor: not-allowed; }
  .btn-alt { background: linear-gradient(90deg, var(--blue), var(--pink)); }
  .btn-ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  .q-result {
    margin-top: 18px; padding: 18px 22px; border-radius: 14px;
    background: #fff; border: 2px solid var(--done); font-size: 1.2rem; line-height: 1.8;
  }
  .q-result b { font-size: 1.8rem; color: var(--done); }

  /* 互動彩蛋 */
  .confetti { position: fixed; width: 10px; height: 14px; border-radius: 2px; pointer-events: none; z-index: 999; }
  .pop {
    position: fixed; pointer-events: none; z-index: 1000;
    font-weight: 700; font-size: 1.6rem; color: var(--done);
    text-shadow: 0 2px 6px rgba(255,255,255,.9); white-space: nowrap;
    transform: translateX(-50%);
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .tasks { grid-row: auto; }
    .bottom { grid-template-columns: 1fr; }
    nav { flex-wrap: wrap; }
    .logout { margin-left: auto; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="page" id="home">

    <nav>
      <div class="avatar" aria-label="使用者頭像">
        <svg viewBox="0 0 36 36" fill="none" stroke="#555" stroke-width="1.5">
          <circle cx="18" cy="13" r="6" fill="#d8cdf0"/>
          <path d="M5 33c1-8 7-11 13-11s12 3 13 11z" fill="#d8cdf0"/>
        </svg>
      </div>
      <ul class="menu">
        <li><a href="#home" class="active">首頁</a></li>
        <li><a href="#courses">復健課程</a></li>
        <li><a href="#quiz">復健測驗</a></li>
        <li><a href="#quiz-result" id="navScore">成績紀錄</a></li>
      </ul>
      <a href="#" class="logout">登出</a>
    </nav>

    <main class="layout">
      <!-- 今日任務 -->
      <section class="box tasks" aria-labelledby="t-title">
        <h2 id="t-title">今日任務</h2>
        <div id="taskList"></div>
      </section>

      <!-- 課程推薦 / 廣告 -->
      <section class="box banner" aria-label="課程推薦" aria-roledescription="輪播">
        <img src="./ad1.jpg" width="1000" height="333" alt="要復健" >
        <img src="./ad2.jpg" width="1000" height="333" alt="社區推薦" >
        <button class="arrow" id="prev" aria-label="上一則">&lt;</button>
        <button class="arrow" id="next" aria-label="下一則">&gt;</button>
        <div class="dots" id="dots"></div>
      </section>

      <div class="bottom">
        <section class="box" aria-labelledby="c-title">
          <h2 id="c-title">完成率</h2>
          <div class="ring" id="ring"><b id="pct">0%</b></div>
        </section>
        <section class="box" id="courses" aria-labelledby="l-title">
          <h2 id="l-title">今日課程</h2>
          <ul class="today-list" id="courseList"></ul>
        </section>
      </div>
    </main>

    <!-- 復健知識測驗 -->
    <section class="box quiz" id="quiz" aria-labelledby="q-title">
      <h2 id="q-title">復健知識測驗</h2>
      <div class="quiz-body">
        <p class="q-meta"><span id="qNo"></span><span id="qScore">目前得分：0</span></p>
        <p class="q-text" id="qText"></p>
        <div class="q-options" id="qOptions"></div>
        <p class="q-feedback" id="qFeedback" role="status"></p>
        <div class="q-actions">
          <button id="qNext" class="btn" disabled>下一題</button>
          <button id="qShow" class="btn btn-alt">顯示成績</button>
          <button id="qReset" class="btn btn-ghost">重新測驗</button>
        </div>
        <div class="q-result" id="quiz-result" hidden></div>
      </div>
    </section>

  </div>
</div>

<script>
  // 範例資料：可改成從後端取得
  const tasks = [
    { name: "肩膀伸展", done: false },
    { name: "膝蓋彎曲", done: false },
    { name: "坐站練習", done: false },
    { name: "手臂上舉", done: false },
    { name: "平衡訓練", done: false },
  ];
  const courses = ["早晨暖身 10 分鐘", "下肢肌力 15 分鐘"];

  const listEl = document.getElementById("taskList");
  const ring = document.getElementById("ring");
  const pct = document.getElementById("pct");

  function render() {
    listEl.innerHTML = "";
    tasks.forEach((t, i) => {
      const row = document.createElement("div");
      row.className = "task" + (t.done ? " done" : "");
      row.innerHTML = `<span>${t.name}</span>
        <button aria-label="${t.name}，${t.done ? "已完成" : "未完成"}">${t.done ? "✓" : ""}</button>`;
      row.querySelector("button").onclick = e => {
        const r = e.currentTarget.getBoundingClientRect();
        t.done = !t.done;
        render();
        if (t.done) {
          if (tasks.every(x => x.done)) centerBurst("今日任務全部完成！🎉");
          else celebrate(r.left + r.width / 2, r.top + r.height / 2, cheers[Math.floor(Math.random() * cheers.length)]);
        }
      };
      listEl.appendChild(row);
    });
    const p = Math.round(tasks.filter(t => t.done).length / tasks.length * 100);
    ring.style.setProperty("--pct", p);
    pct.textContent = p + "%";
  }

  document.getElementById("courseList").innerHTML =
    courses.map(c => `<li>${c}</li>`).join("");

  // 推薦輪播
  const slides = [...document.querySelectorAll(".slide")];
  const dotsEl = document.getElementById("dots");
  let bannerIdx = 0, timer;
  slides.forEach((_, i) => {
    const d = document.createElement("button");
    d.setAttribute("aria-label", `第 ${i + 1} 則`);
    d.onclick = () => { go(i); restart(); };
    dotsEl.appendChild(d);
  });
  function go(i) {
    bannerIdx = (i + slides.length) % slides.length;
    slides.forEach((el, k) => el.classList.toggle("show", k === bannerIdx));
    [...dotsEl.children].forEach((el, k) => el.classList.toggle("on", k === bannerIdx));
  }
  function restart() { clearInterval(timer); timer = setInterval(() => go(bannerIdx + 1), 5000); }
  document.getElementById("next").onclick = () => { go(bannerIdx + 1); restart(); };
  document.getElementById("prev").onclick = () => { go(bannerIdx - 1); restart(); };
  go(0); restart();


  // ===== 互動彩蛋 =====
  function celebrate(x, y, text, count = 24) {
    const colors = ["#f8939f", "#6f82c8", "#7a6cc0", "#ffc94d", "#6fcf97"];
    for (let i = 0; i < count; i++) {
      const el = document.createElement("span");
      el.className = "confetti";
      el.style.left = x + "px"; el.style.top = y + "px";
      el.style.background = colors[i % colors.length];
      document.body.appendChild(el);
      const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 110;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 50;
      el.animate([
        { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
        { transform: `translate(${dx}px,${dy + 90}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 600, easing: "cubic-bezier(.2,.8,.3,1)" })
        .onfinish = () => el.remove();
    }
    if (text) {
      const t = document.createElement("span");
      t.className = "pop"; t.textContent = text;
      t.style.left = x + "px"; t.style.top = (y - 20) + "px";
      document.body.appendChild(t);
      t.animate([
        { transform: "translate(-50%,0) scale(.6)", opacity: 0 },
        { transform: "translate(-50%,-30px) scale(1.15)", opacity: 1, offset: .25 },
        { transform: "translate(-50%,-80px) scale(1)", opacity: 0 }
      ], { duration: 1500, easing: "ease-out" }).onfinish = () => t.remove();
    }
  }
  const cheers = ["太棒了！👏", "做得好！✨", "繼續加油！💪", "又完成一項！🌟"];
  const centerBurst = text => celebrate(innerWidth / 2, innerHeight / 2, text, 70);

  // ===== 測驗功能 =====
  const quiz = [
    { q: "開始居家復健運動前，最適合先做哪一件事？",
      opts: ["直接做高強度訓練", "先做暖身伸展", "憋氣用力撐住"], ans: 1,
      why: "暖身可以讓關節與肌肉準備好，降低受傷風險。" },
    { q: "做復健動作時突然感到劇烈疼痛，應該怎麼辦？",
      opts: ["忍耐把動作做完", "加快速度結束", "立刻停止並告知醫師或治療師"], ans: 2,
      why: "劇烈疼痛是警訊，應該先停止並尋求專業協助。" },
    { q: "做「坐站練習」時，哪個做法正確？",
      opts: ["膝蓋對準腳尖，緩慢起身", "身體前傾快速彈起", "雙腳併攏懸空站起"], ans: 0,
      why: "緩慢且姿勢正確，才能鍛鍊腿部肌力又保護膝蓋。" },
  ];
  const POINT = 10;
  let qi = 0, qTotal = 0, qDone = new Array(quiz.length).fill(null); // null=未作答, true/false

  const $ = id => document.getElementById(id);

  function showQuestion() {
    const item = quiz[qi];
    $("qNo").textContent = `第 ${qi + 1} / ${quiz.length} 題`;
    $("qScore").textContent = `目前得分：${qTotal}`;
    $("qText").textContent = item.q;
    $("qFeedback").textContent = "";
    $("qOptions").innerHTML = "";
    item.opts.forEach((text, i) => {
      const b = document.createElement("button");
      b.textContent = `${"ABC"[i]}. ${text}`;
      b.onclick = () => answer(i);
      $("qOptions").appendChild(b);
    });
    $("qNext").disabled = true;
    $("qNext").textContent = qi === quiz.length - 1 ? "最後一題" : "下一題";
  }

  function answer(i) {
    const item = quiz[qi];
    const btns = $("qOptions").children;
    [...btns].forEach(b => b.disabled = true);
    const ok = i === item.ans;
    qDone[qi] = ok;
    btns[item.ans].classList.add("correct");
    const rr = btns[i].getBoundingClientRect();
    if (ok) {
      celebrate(rr.left + rr.width / 2, rr.top + rr.height / 2, `+${POINT} 分 ✨`);
      qTotal += POINT;                      // 答對加分
      $("qFeedback").textContent = `✅ 答對了！+${POINT} 分。${item.why}`;
    } else {
      btns[i].classList.add("wrong");
      btns[i].animate([{ transform: "translateX(0)" }, { transform: "translateX(-8px)" }, { transform: "translateX(8px)" }, { transform: "translateX(0)" }], { duration: 300 });
      $("qFeedback").textContent = `❌ 答錯了，正確答案是 ${"ABC"[item.ans]}。${item.why}`;
    }
    $("qScore").textContent = `目前得分：${qTotal}`;
    $("qNext").disabled = qi === quiz.length - 1;
    if (qi === quiz.length - 1 && qDone.every(v => v === true)) setTimeout(() => centerBurst("滿分！太厲害了 🏆"), 400);
  }

  $("qNext").onclick = () => { if (qi < quiz.length - 1) { qi++; showQuestion(); } };

  // 顯示成績按鈕
  $("qShow").onclick = () => {
    const answered = qDone.filter(v => v !== null).length;
    const correct = qDone.filter(v => v === true).length;
    const box = $("quiz-result");
    box.hidden = false;
    box.innerHTML = `你的總成績：<b>${qTotal}</b> / ${quiz.length * POINT} 分<br>
      答對 ${correct} 題，答錯 ${answered - correct} 題` +
      (answered < quiz.length ? `，還有 ${quiz.length - answered} 題未作答` : "") + "。";
    box.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  $("qReset").onclick = () => {
    qi = 0; qTotal = 0; qDone.fill(null);
    $("quiz-result").hidden = true;
    $("navScore").onclick = e => { e.preventDefault(); $("qShow").click(); };

  showQuestion();
  };

  showQuestion();

  render();
</script>
</body>
</html>
